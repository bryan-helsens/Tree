name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace now contains Flutter packages (grow_render, tree_lab), so
      # resolution needs the Flutter SDK. The pure packages remain pure — they
      # just resolve through it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve workspace
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Architecture boundaries
        run: dart run tools/arch_check/bin/arch_check.dart

      - name: Content is in sync with its source
        working-directory: packages/grow_content
        run: |
          dart run tool/embed_content.dart
          git diff --exit-code lib/src/content_asset.g.dart

      - name: Tests
        run: |
          for pkg in packages/grow_domain packages/grow_content packages/grow_sim \
                     packages/grow_flora packages/grow_data; do
            echo "== $pkg"
            (cd "$pkg" && dart test --reporter=expanded)
          done
          (cd packages/grow_render && flutter test test/bench_test.dart)
          # Crash recovery, the interaction chain and the focus surface. All
          # fast; the screenshot test is not, and is run locally.
          (cd apps/grow_app && flutter test test/session_recovery_test.dart \
                                           test/interaction_flow_test.dart \
                                           test/focus_ui_test.dart \
                                           test/focus_flow_test.dart)

      # Milestone M1: a headless 30-day simulation runs in CI and emits a CSV.
      # Exits non-zero if any balance ship criterion regresses, so the economy
      # cannot drift without someone deciding that it should.
      - name: Balance ship criteria
        run: dart run tools/balance_sim/bin/balance_sim.dart --days 30 --csv balance.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-report
          path: balance.csv
