name: grow_render
description: Draws what grow_flora generates, using the same Canvas the game ships.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  grow_domain: ^0.1.0
  grow_flora: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test-only: the validation sheets drive the renderer from real simulation
  # state, which is the whole point of them.
  grow_content: ^0.1.0
  grow_sim: ^0.1.0
  lints: ^6.0.0

flutter:
  assets:
    - assets/canopy_oak.png
